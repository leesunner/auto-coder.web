<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战游戏测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .game-canvas {
            border: 3px solid #1976D2;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 0 20px rgba(25, 118, 210, 0.3);
            margin: 20px 0;
        }
        .controls {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .info-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 坦克大战游戏测试</h1>
        
        <div class="controls">
            <h3>游戏控制</h3>
            <p>W/A/S/D: 移动坦克 | 空格: 发射子弹</p>
        </div>

        <canvas id="gameCanvas" class="game-canvas" width="800" height="600"></canvas>
        
        <div class="info">
            <div class="info-item">
                <h4>得分</h4>
                <span id="score">0</span>
            </div>
            <div class="info-item">
                <h4>关卡</h4>
                <span id="level">1</span>
            </div>
            <div class="info-item">
                <h4>生命值</h4>
                <span id="health">100</span>
            </div>
            <div class="info-item">
                <h4>敌人数量</h4>
                <span id="enemies">5</span>
            </div>
        </div>

        <div style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
            <p>这是一个纯JavaScript版本的坦克大战游戏测试</p>
            <p>展示了面向对象的游戏开发架构</p>
        </div>
    </div>

    <script>
        // 简化版游戏类用于测试
        class SimpleTankGame {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.isRunning = false;
                this.keys = {};
                this.player = { x: 100, y: 500, angle: 0, health: 100 };
                this.enemies = [
                    { x: 700, y: 100, angle: Math.PI },
                    { x: 600, y: 100, angle: Math.PI },
                    { x: 500, y: 100, angle: Math.PI }
                ];
                this.bullets = [];
                this.score = 0;
                this.level = 1;
                
                this.setupEventListeners();
                this.start();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) {
                        e.preventDefault();
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
            }

            start() {
                this.isRunning = true;
                this.gameLoop();
            }

            gameLoop() {
                if (!this.isRunning) return;
                
                this.update();
                this.render();
                
                requestAnimationFrame(() => this.gameLoop());
            }

            update() {
                // 处理玩家输入
                if (this.keys['KeyW']) {
                    this.player.x += Math.cos(this.player.angle) * 2;
                    this.player.y += Math.sin(this.player.angle) * 2;
                }
                if (this.keys['KeyS']) {
                    this.player.x -= Math.cos(this.player.angle) * 2;
                    this.player.y -= Math.sin(this.player.angle) * 2;
                }
                if (this.keys['KeyA']) {
                    this.player.angle -= 0.05;
                }
                if (this.keys['KeyD']) {
                    this.player.angle += 0.05;
                }

                // 约束玩家在画布内
                this.player.x = Math.max(20, Math.min(this.canvas.width - 20, this.player.x));
                this.player.y = Math.max(20, Math.min(this.canvas.height - 20, this.player.y));

                // 更新UI
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('health').textContent = this.player.health;
                document.getElementById('enemies').textContent = this.enemies.length;
            }

            render() {
                // 清空画布
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制玩家
                this.renderTank(this.player, '#4CAF50');

                // 绘制敌人
                this.enemies.forEach(enemy => {
                    this.renderTank(enemy, '#F44336');
                });

                // 绘制UI信息
                this.ctx.fillStyle = '#FFF';
                this.ctx.font = '16px Arial';
                this.ctx.textAlign = 'left';
                this.ctx.fillText(`得分: ${this.score}`, 10, 25);
                this.ctx.fillText(`关卡: ${this.level}`, 10, 45);
                this.ctx.fillText(`生命值: ${this.player.health}`, 10, 65);
                
                // 控制说明
                this.ctx.textAlign = 'right';
                this.ctx.font = '12px Arial';
                this.ctx.fillStyle = '#CCC';
                this.ctx.fillText('WASD: 移动', this.canvas.width - 10, 25);
                this.ctx.fillText('空格: 射击', this.canvas.width - 10, 40);
            }

            renderTank(tank, color) {
                this.ctx.save();
                this.ctx.translate(tank.x, tank.y);
                this.ctx.rotate(tank.angle);

                // 坦克主体
                this.ctx.fillStyle = color;
                this.ctx.fillRect(-15, -15, 30, 30);

                // 炮管
                this.ctx.fillStyle = '#333';
                this.ctx.fillRect(15, -3, 15, 6);

                // 方向指示器
                this.ctx.fillStyle = '#FFF';
                this.ctx.fillRect(10, -2, 8, 4);

                this.ctx.restore();
            }
        }

        // 启动游戏
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            new SimpleTankGame(canvas);
        });
    </script>
</body>
</html>
