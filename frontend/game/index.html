
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #2c3e50, #34495e);
        }

        #gameTitle {
            font-size: 3rem;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #f39c12, 0 0 10px #f39c12, 0 0 15px #f39c12; }
            to { text-shadow: 0 0 10px #f39c12, 0 0 20px #f39c12, 0 0 30px #f39c12; }
        }

        #gameCanvas {
            border: 3px solid #3498db;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.5);
            background: #2c5234;
        }

        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #3498db;
            min-width: 200px;
        }

        .ui-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 14px;
        }

        .ui-label {
            color: #ecf0f1;
        }

        .ui-value {
            color: #f39c12;
            font-weight: bold;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #3498db;
            font-size: 12px;
            line-height: 1.5;
        }

        #startButton {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        #startButton:hover {
            background: linear-gradient(45deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
        }

        #startButton:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #e74c3c;
            text-align: center;
            z-index: 200;
        }

        #gameOver h2 {
            color: #e74c3c;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #restartButton {
            background: linear-gradient(45deg, #27ae60, #229954);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        #restartButton:hover {
            background: linear-gradient(45deg, #229954, #1e8449);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1 id="gameTitle">坦克大战</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <button id="startButton">开始游戏</button>
        
        <div id="gameUI" class="hidden">
            <div class="ui-panel">
                <div class="ui-item">
                    <span class="ui-label">生命值:</span>
                    <span class="ui-value" id="playerHealth">100</span>
                </div>
                <div class="ui-item">
                    <span class="ui-label">得分:</span>
                    <span class="ui-value" id="playerScore">0</span>
                </div>
                <div class="ui-item">
                    <span class="ui-label">等级:</span>
                    <span class="ui-value" id="gameLevel">1</span>
                </div>
                <div class="ui-item">
                    <span class="ui-label">敌人数量:</span>
                    <span class="ui-value" id="enemyCount">0</span>
                </div>
            </div>
        </div>

        <div id="controls" class="hidden">
            <strong>游戏控制:</strong><br>
            WASD - 移动坦克<br>
            空格键 - 发射子弹<br>
            ESC - 暂停游戏<br>
            R - 重新开始
        </div>

        <div id="gameOver" class="hidden">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <p>存活时间: <span id="survivalTime">0</span>秒</p>
            <button id="restartButton">重新开始</button>
        </div>
    </div>

    <!-- 游戏脚本文件 -->
    <script src="js/Vector2D.js"></script>
    <script src="js/GameObject.js"></script>
    <script src="js/Bullet.js"></script>
    <script src="js/Tank.js"></script>
    <script src="js/PlayerTank.js"></script>
    <script src="js/EnemyTank.js"></script>
    <script src="js/Wall.js"></script>
    <script src="js/GameMap.js"></script>
    <script src="js/InputManager.js"></script>
    <script src="js/SoundManager.js"></script>
    <script src="js/ParticleSystem.js"></script>
    <script src="js/GameEngine.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
